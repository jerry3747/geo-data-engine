[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geonow"
version = "0.1.0"
description = "Local GEO monitoring for Doubao and Kimi web answers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
web = ["playwright>=1.45"]
yaml = ["PyYAML>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
geonow = "geonow.cli:main"

[tool.setuptools.packages.find]
include = ["geonow*"]
